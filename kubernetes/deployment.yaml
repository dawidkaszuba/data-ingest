apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingest
  labels:
    app: data-ingest
  namespace: iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-ingest
  template:
    metadata:
      labels:
        app: data-ingest
    spec:
      containers:
        - name: data-ingest
          image: dawidkaszuba/data-ingest:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "10.0.0.110:9092"
            - name: RAW_DATA_TOPIC_NAME
              value: "raw-data"
            - name: RAW_DATA_TOPIC_PARTITIONS
              value: "3"
            - name: RAW_DATA_TOPIC_REPLICAS
              value: "1"
            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: mqtt-secret
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-secret
                  key: password
            - name: MQTT_BROKER_URL
              value: "tcp://10.0.0.121:1883"
            - name: MQTT_TOPICS
              value: "sensors/bedroom, zigbee2mqtt/czujnik-sypialnia"
